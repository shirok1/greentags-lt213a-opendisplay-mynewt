name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.10'
          cache: false
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
          git clone https://github.com/apache/mynewt-newt "$RUNNER_TEMP/mynewt-newt"
          cd "$RUNNER_TEMP/mynewt-newt"
          git checkout ae817d0ccbfbae1e1e020d086a6d3c50a8687206
          go install ./newt
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Fetch firmware dependencies
        run: ./tools/bootstrap.sh
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Host tests and sanitizers
        run: ./tools/test.sh
      - name: Build firmware and check resource limits
        run: |
          newt version
          arm-none-eabi-gcc --version
          ./tools/build.sh
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lt213a-firmware
          if-no-files-found: error
          path: |
            bin/targets/lt213a/app/apps/opendisplay/opendisplay.elf
            bin/targets/lt213a/app/apps/opendisplay/opendisplay.hex
            bin/targets/lt213a/app/apps/opendisplay/opendisplay.bin
